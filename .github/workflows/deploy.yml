name: Deploy to Vercel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Project-scoped Vercel tokens cannot use `vercel pull`, so package the
      # static export directly as Vercel Build Output API v3.
      - name: Package static export
        run: |
          mkdir -p .vercel/output/static
          cp -R out/. .vercel/output/static/
          printf '%s\n' '{"version":3,"routes":[{"handle":"error"},{"status":404,"src":"^(?!/api).*$","dest":"/404.html"}]}' > .vercel/output/config.json
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
      - run: npm install --global vercel@52.2.1
      - run: vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN"
